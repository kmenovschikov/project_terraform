#cloud-config
users:
  - name: ubuntu
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh-authorized-keys:
      - ${ssh_key}

package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - jq

write_files:
  - path: /opt/app/docker-compose.yaml
    content: |
      ${indent(6, compose_content)}

  - path: /opt/app/.env
    permissions: '0600'
    content: |
      REGISTRY_ID=${registry_id}
      DB_HOST=${db_host}
      DB_USER=${db_user}
      DB_PASSWORD=${db_password}
      DB_NAME=${db_name}

runcmd:
  - export HOME=/root
  - systemctl enable --now docker
  - sleep 5
  - |
    curl -s -f -H "Metadata-Flavor: Google" \
      http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token \
      | jq -r '.access_token' \
      | docker login --username iam --password-stdin cr.yandex
  - docker compose --project-directory /opt/app pull
  - docker compose --project-directory /opt/app up -d
