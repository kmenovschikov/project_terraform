services:
  web:
    # Указываем полный путь к вашему Yandex Container Registry.
    # Переменная REGISTRY_ID подставится из терминала или файла .env
    image: cr.yandex/${REGISTRY_ID}/python-mysql-app:latest
    
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      provenance: false
      
    container_name: python-web
    restart: always
    ports:
      # Пробрасываем стандартный 80 порт хоста на 8080 порт контейнера (согласно Security Group)
      - "80:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
